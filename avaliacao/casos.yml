  # de um teste NÃO deve ser apontado. É um falso positivo clássico que a
  # ferramenta precisa evitar por construção, não por sorte do modelo.
  - nome: segredo_em_teste_isento
    caminho: tests/test_conexao.py
    esperado: []
    codigo: |
      from app.servicos.conexao import consultar


      def test_consultar_usa_o_token():
          token_falso = "sk-teste-0000000000000000"
          assert consultar("recurso", token=token_falso) is not None
