  - nome: excecao_silenciada
    caminho: app/servicos/publicador.py
    esperado: [QUA-001]
    codigo: |
      def publicar(cliente, destino: str, texto: str) -> None:
          try:
              cliente.enviar(destino, texto)
          except Exception:
              pass


      def publicar_varios(cliente, destinos: list, texto: str) -> None:
