  - nome: nucleo_escolhe_implementacao_por_ambiente
    caminho: app/core/revisao.py
    esperado: [ARQ-004]
    codigo: |
      import os

      from app.core.ports import LLMPort, RepositorioPort


      def revisar(pr, repositorio: RepositorioPort, llm: LLMPort) -> list[str]:
          # O nucleo lendo o ambiente: a montagem pertence ao ponto de composicao.
          limite = int(os.environ["LIMITE_DE_ARQUIVOS"])
          if os.getenv("MODO_ESTRITO") == "1":
              limite = limite * 2

          arquivos = repositorio.obter_arquivos_alterados(pr)[:limite]
          return [llm.avaliar(arquivo.diff) for arquivo in arquivos]

