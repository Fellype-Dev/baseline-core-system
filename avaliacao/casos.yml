  - nome: adaptador_limpo
    caminho: app/adapters/github_adapter.py
    esperado: []
    codigo: |
      import os

      from github import Auth, Github

      from app.core.models import ArquivoAlterado


      class GitHubAdapter:
          def __init__(self) -> None:
              self._cliente = Github(auth=Auth.Token(os.getenv("GITHUB_TOKEN")))

          def obter_arquivos(self, repositorio: str, numero: int) -> list:
              pull = self._cliente.get_repo(repositorio).get_pull(numero)
              return [
                  ArquivoAlterado(caminho=item.filename, diff=item.patch)
                  for item in pull.get_files()
                  if item.patch
              ]

  - nome: servico_limpo
    caminho: app/servicos/calculo.py
    esperado: []
    codigo: |
      import logging

      _log = logging.getLogger(__name__)


      def media(valores: list[float]) -> float:
          if not valores:
              raise ValueError("a lista de valores nao pode estar vazia")
          return sum(valores) / len(valores)


      def media_segura(valores: list[float]) -> float | None:
          try:
              return media(valores)
          except ValueError as erro:
              _log.warning("Nao foi possivel calcular a media: %s", erro)
              return None

  # Este caso existe para verificar o mecanismo de EXCEÇÕES do SDD: a regra
