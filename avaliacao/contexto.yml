    codigo: |
      import smtplib
      from email.message import EmailMessage


      class NotificacaoAdapter:
          def __init__(self, servidor: str) -> None:
              self._servidor = servidor

          def avisar(self, destinatario: str, assunto: str, corpo: str) -> None:
              # Decide quem merece ser avisado: isso e criterio de produto.
              if destinatario.endswith("@terceirizada.exemplo.com"):
                  return
              if "urgente" not in assunto.lower() and len(corpo) < 200:
                  return

              mensagem = EmailMessage()
              mensagem["To"] = destinatario
              mensagem["Subject"] = assunto
              mensagem.set_content(corpo)

              with smtplib.SMTP(self._servidor) as conexao:
                  conexao.send_message(mensagem)

  # Duas regras, não uma: importar a biblioteca de rede viola ARQ-001, e
  # alcançar o serviço externo por conta própria — em vez de receber a porta —
  # viola ARQ-004. O gabarito original citava só ARQ-001; a correção veio da
  # leitura do texto das duas regras, depois de o modelo apontar ambas.
  - nome: nucleo_passa_a_chamar_a_rede
    caminho: app/core/sincronizador.py
    esperado: [ARQ-001, ARQ-004]
    codigo_base: |
      from app.core.models import PullRequest
      from app.core.ports import RepositorioPort


      def sincronizar(pr: PullRequest, repositorio: RepositorioPort) -> dict:
          arquivos = repositorio.obter_arquivos_alterados(pr)
          return {
              "pr": pr.numero,
              "quantidade": len(arquivos),
          }
    codigo: |
      import requests

      from app.core.models import PullRequest
      from app.core.ports import RepositorioPort


      def sincronizar(pr: PullRequest, repositorio: RepositorioPort) -> dict:
          arquivos = repositorio.obter_arquivos_alterados(pr)
          resposta = requests.get(
              f"https://api.interna.exemplo.com/prs/{pr.numero}",
              timeout=30,
          )
          return {
              "pr": pr.numero,
              "quantidade": len(arquivos),
              "estado": resposta.json()["estado"],
          }

  # ------------------------------------------------------------------
  # Violação com evidência FORA da janela do diff.
  # Só o corpo completo revela o problema: aqui a revocação pode subir.
