      import logging

      _log = logging.getLogger(__name__)


      def processar_evento(evento: dict, deposito) -> None:
          identificador = evento.get("id")
          if identificador is None:
              return None

          try:
              evento = dict(evento)
              registro = deposito.carregar(identificador)
              deposito.salvar(registro.aplicar(evento))
          except Exception:
              _log.exception("Falha ao processar o evento %s.", identificador)
              raise

  - nome: excecao_repropagada_fora_da_janela
    caminho: app/servicos/importador.py
    esperado: []
    codigo_base: |
      class ErroDeImportacao(Exception):
          pass


      def importar(linhas: list[str]) -> list[dict]:
          registros = []
          for numero, linha in enumerate(linhas, start=1):
              try:
                  nome, valor = linha.split(";")
                  registros.append({"nome": nome, "valor": float(valor)})
              except ValueError as erro:
                  raise ErroDeImportacao(f"falha na linha {numero}") from erro
          return registros
    codigo: |
      class ErroDeImportacao(Exception):
          pass


      def importar(linhas: list[str]) -> list[dict]:
          registros = []
          for numero, linha in enumerate(linhas, start=1):
              try:
                  linha = linha.rstrip()
                  nome, valor = linha.split(";")
                  registros.append({"nome": nome, "valor": float(valor)})
              except ValueError as erro:
                  raise ErroDeImportacao(f"falha na linha {numero}") from erro
          return registros

  - nome: credencial_do_ambiente_fora_da_janela
    caminho: app/servicos/banco.py
    esperado: []
    codigo_base: |
      import os

      import psycopg2


      def abrir_conexao(nome_do_banco: str):
          usuario = os.environ["DB_USER"]
          senha = os.environ["DB_PASSWORD"]
          servidor = os.environ["DB_HOST"]
          porta = os.environ.get("DB_PORT", "5432")

          if not nome_do_banco:
              raise ValueError("nome do banco nao informado")

          url = f"postgresql://{usuario}:{senha}@{servidor}:{porta}/{nome_do_banco}"
          return psycopg2.connect(url)
    codigo: |
      import os

      import psycopg2


      def abrir_conexao(nome_do_banco: str):
          usuario = os.environ["DB_USER"]
          senha = os.environ["DB_PASSWORD"]
          servidor = os.environ["DB_HOST"]
          porta = os.environ.get("DB_PORT", "5432")

          if not nome_do_banco:
              raise ValueError("nome do banco nao informado")

          endereco = f"{servidor}:{porta}"
          url = f"postgresql://{usuario}:{senha}@{endereco}/{nome_do_banco}"
          return psycopg2.connect(url)

  # ------------------------------------------------------------------
  # Conformidade com ISCA no corpo completo.
  # O corpo mostra trecho que, lido fora de contexto, parece violação. Se o
  # corpo induzir sobre-apontamento, a precisão cai aqui — é o risco que
  # esta correção precisa correr para ser medida com honestidade.
  # ------------------------------------------------------------------

  - nome: adaptador_so_traduz_com_condicional_de_formato
    caminho: app/adapters/github_adapter.py
    esperado: []
    codigo_base: |
      from app.core.models import ArquivoAlterado


      class GitHubAdapter:
          def __init__(self, cliente) -> None:
              self._cliente = cliente

          def obter_arquivos_alterados(self, pr) -> list[ArquivoAlterado]:
              arquivos = []
              for item in self._cliente.arquivos(pr.numero):
                  if item.patch is None:
                      continue
                  arquivos.append(
                      ArquivoAlterado(item.caminho, item.patch, item.bruto.decode("utf-8"))
                  )
              return arquivos
    codigo: |
      from app.core.models import ArquivoAlterado


      class GitHubAdapter:
          def __init__(self, cliente) -> None:
              self._cliente = cliente

          def obter_arquivos_alterados(self, pr) -> list[ArquivoAlterado]:
              arquivos = []
              for item in self._cliente.arquivos(pr.numero):
                  if item.patch is None:
                      continue
                  conteudo = item.bruto.decode("utf-8-sig")
                  arquivos.append(
                      ArquivoAlterado(item.caminho, item.patch, conteudo)
                  )
              return arquivos

  # Substituiu uma isca de DOC-001, removida junto com a regra: um revisor
  # arquitetural não tem o que dizer sobre anos fixos em títulos. A isca aqui é
  # de ARQ-004 — o núcleo decide um caminho, mas decide a partir de um valor que
  # chegou pela assinatura, que é exatamente o que a regra permite.
  - nome: nucleo_decide_por_parametro_recebido
    caminho: app/core/revisao.py
    esperado: []
    codigo_base: |
      from app.core.ports import LLMPort, RepositorioPort


      def revisar(pr, repositorio: RepositorioPort, llm: LLMPort) -> list[str]:
          arquivos = repositorio.obter_arquivos_alterados(pr)
          return [llm.avaliar(arquivo.diff) for arquivo in arquivos]
    codigo: |
      from app.core.ports import LLMPort, RepositorioPort


      def revisar(
          pr,
          repositorio: RepositorioPort,
          llm: LLMPort,
          limite_de_arquivos: int = 0,
      ) -> list[str]:
          arquivos = repositorio.obter_arquivos_alterados(pr)
          if limite_de_arquivos:
              arquivos = arquivos[:limite_de_arquivos]
          return [llm.avaliar(arquivo.diff) for arquivo in arquivos]

