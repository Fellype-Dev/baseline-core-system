# Integração contínua: executa a suíte de testes a cada envio e a cada Pull
# Request.
#
# Há uma coerência deliberada aqui: este trabalho propõe uma ferramenta de
# governança automatizada em CI/CD, e seria incoerente que o próprio projeto
# dependesse de alguém lembrar de rodar os testes na máquina local.
#
# Apenas os testes rápidos rodam aqui. Os marcados como `integracao` exigem o
# modelo de embeddings (cerca de 220 MB), o índice vetorial já construído e um
# executor de modelo de linguagem local — dependências pesadas e de ambiente,
# que são verificadas na máquina de desenvolvimento.

name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    name: Suíte rápida (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Instala a partir de requirements.txt, e não de requirements.lock.txt:
      # o lock foi gerado no Windows e inclui pacotes exclusivos daquela
      # plataforma (pywin32), que não se instalam no runner Linux.
      - name: Instalar as dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar os testes
        run: pytest -m "not integracao" -v
